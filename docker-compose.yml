version: '3.8'
services:
  worker:
    container_name: syncwave-worker
    build: ./worker
    ports:
      - "8000:8000"
    volumes:
      - ./worker/src:/app/src
      - ./worker/node_modules:/app/node_modules
    environment:
      - BEARER_TOKEN=${BEARER_TOKEN}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?schema=public
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:?err}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - NODE_ENV=${NODE_ENV}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - syncwave-network
    restart: unless-stopped

  postgres-db:
    image: postgres:15
    container_name: "syncwave-postgres"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:?err}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - syncwave-network
    restart: always

  pgadmin:
    container_name: syncwave-pgadmin
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@syncwave.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - syncwave-network
    restart: unless-stopped
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./pgpassfile:/tmp/pgpassfile:ro

  prisma-studio:
    container_name: syncwave-prisma-studio
    build: 
      context: ./worker
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?schema=public
    command: ["bun", "run", "db:studio", "--hostname", "0.0.0.0"]
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - syncwave-network
    restart: unless-stopped
    volumes:
      - ./worker/prisma:/usr/src/app/prisma:ro

networks:
  syncwave-network:
    driver: bridge

volumes:
  postgres-data:

